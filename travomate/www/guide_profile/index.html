<!DOCTYPE html>
<html lang="en-US" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete Your Guide Profile | Travomate</title>
  <link href="assets/css/theme.css" rel="stylesheet" />
</head>

<body>
  <main class="main" id="top">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-5 d-block" data-navbar-on-scroll="data-navbar-on-scroll">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="assets/img/logo.svg" height="100" alt="logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse border-top border-lg-0 mt-4 mt-lg-0" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto pt-2 pt-lg-0 font-base align-items-lg-center align-items-start">
            <li class="nav-item px-3 px-xl-4"><a class="nav-link fw-medium" href="guide-dashboard.html">Dashboard</a></li>
            <li class="nav-item px-3 px-xl-4"><a class="btn btn-outline-dark order-1 order-lg-0 fw-medium" href="#" onclick="logout()">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Guide Profile Form -->
    <section class="pt-5" style="padding-top: 7rem;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow">
              <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold">Complete Your Guide Profile</h2>
                <form id="guideProfileForm">
                  <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" value="{{ guide.full_name or '' }}" placeholder="Enter your full name" required>
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="{{ guide.email or '' }}" placeholder="Enter your email" required>
                  </div>
                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" value="{{ guide.phone or '' }}" placeholder="Enter your phone number" required>
                  </div>
                  <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-control" id="gender" required>
                      <option value="">Select Gender</option>
                      <option value="Male" {% if guide.gender == "Male" %}selected{% endif %}>Male</option>
                      <option value="Female" {% if guide.gender == "Female" %}selected{% endif %}>Female</option>
                      <option value="Other" {% if guide.gender == "Other" %}selected{% endif %}>Other</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="date_of_birth" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="date_of_birth" value="{{ guide.date_of_birth or '' }}" required>
                  </div>
                  <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" value="{{ guide.address or '' }}" placeholder="Enter your address" required>
                  </div>
                  <div class="mb-3">
                    <label for="nationality" class="form-label">Nationality</label>
                    <input type="text" class="form-control" id="nationality" value="{{ guide.nationality or '' }}" placeholder="Enter your nationality" required>
                  </div>
                  <div class="mb-3">
                    <label for="profile_picture" class="form-label">Profile Picture</label>
                    <input type="file" class="form-control" id="profile_picture" accept="image/*">
                    {% if guide.profile_picture %}
                      <small class="text-muted">Current Profile Picture: <a href="{{ guide.profile_picture }}" target="_blank">View</a></small>
                    {% endif %}
                  </div>
                  <div class="mb-3">
                    <label for="language_spoken" class="form-label">Languages Spoken</label>
                    <input type="text" class="form-control" id="language_spoken" value="{{ guide.language_spoken or '' }}" placeholder="Enter languages you speak (e.g., English, Spanish)" required>
                  </div>
                  <div class="mb-3">
                    <label for="identification_document" class="form-label">Identification Document</label>
                    <input type="file" class="form-control" id="identification_document" accept=".pdf,.doc,.docx,.jpg,.png">
                    {% if guide.identification_document %}
                      <small class="text-muted">Current Identification Document: <a href="{{ guide.identification_document }}" target="_blank">View</a></small>
                    {% endif %}
                  </div>
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 text-center">
      <p class="mb-0 text-secondary fs--1 fw-medium">All rights reserved@travomate.co</p>
    </footer>
  </main>

  <!-- Scripts -->
  <script src="vendors/@popperjs/popper.min.js"></script>
  <script src="vendors/bootstrap/bootstrap.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    // Handle form submission
    document.getElementById('guideProfileForm').addEventListener('submit', function (event) {
      event.preventDefault();

      // Create FormData object to handle file uploads
      const formData = new FormData();
      formData.append('full_name', document.getElementById('full_name').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('gender', document.getElementById('gender').value);
      formData.append('date_of_birth', document.getElementById('date_of_birth').value);
      formData.append('address', document.getElementById('address').value);
      formData.append('nationality', document.getElementById('nationality').value);
      formData.append('language_spoken', document.getElementById('language_spoken').value);

      // Append profile picture file if selected
      const profilePicture = document.getElementById('profile_picture').files[0];
      if (profilePicture) {
        formData.append('profile_picture', profilePicture);
      }

      // Append identification document file if selected
      const identificationDocument = document.getElementById('identification_document').files[0];
      if (identificationDocument) {
        formData.append('identification_document', identificationDocument);
      }

      // Save data to the Guide doctype (replace with your API endpoint)
      fetch('/api/method/custom_app.update_guide_profile', {
        method: 'POST',
        body: formData,  // Use FormData for file uploads
      })
        .then(response => response.json())
        .then(data => {
          if (data.message === 'success') {
            alert('Profile saved successfully!');
            window.location.href = '/guide_dash';  // Redirect to dashboard
          } else {
            alert('Error saving profile. Please try again.');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
        });
    });

    // Logout function
    function logout() {
      fetch('/api/method/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
      })
        .then(response => {
          if (response.ok) {
            window.location.href = 'index.html';
          } else {
            alert('Logout failed. Please try again.');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
        });
    }
  </script>
</body>

</html>
