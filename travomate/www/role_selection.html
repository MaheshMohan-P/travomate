<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Role - Travomate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .role-container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    .role-container h2 {
      margin-bottom: 1rem;
    }
    .role-container button {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .role-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="role-container">
    <h2>Select Your Role</h2>
    <button onclick="selectRole('Traveler')">I am a Traveler</button>
    <button onclick="selectRole('Guide')">I am a Guide</button>
  </div>

  <script>
    function selectRole(role) {
      frappe.call({
        method: "travomate.travomate.doctype.signup.signup.set_role",
        args: {
          email: "{{ frappe.session.user }}",  // Pass the logged-in user's email
          role: role
        },
        callback: (response) => {
          if (response.message.status === 'success') {
            window.location.href = `/${role.toLowerCase()}_dash`;  // Redirect to respective dashboard
          } else {
            alert(response.message.message || 'Failed to set role. Please try again.');
          }
        }
      });
    }
  </script>
  </body>
</html>
