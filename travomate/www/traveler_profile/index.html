<!DOCTYPE html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ frappe.csrf_token }}">
    <title>Complete Your Traveler Profile | Travomate</title>
    <link href="assets/css/theme.css" rel="stylesheet" />
    <style>
      .loading-spinner {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
      }
    </style>
  </head>
<body>
  <main class="main" id="top">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-5 d-block" data-navbar-on-scroll="data-navbar-on-scroll">
      <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse border-top border-lg-0 mt-4 mt-lg-0" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto pt-2 pt-lg-0 font-base align-items-lg-center align-items-start">
            <li class="nav-item px-3 px-xl-4"><a class="nav-link fw-medium" href="/traveler_dash">Dashboard</a></li>
            <li class="nav-item px-3 px-xl-4"><a class="btn btn-outline-dark order-1 order-lg-0 fw-medium" href="#" onclick="logout()">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Traveler Profile Form -->
    <section class="pt-5" style="padding-top: 7rem;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow">
              <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold">Complete Your Traveler Profile</h2>
                <form id="travelerProfileForm" method="POST">
                  <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" value="{{ traveler.full_name or '' }}" placeholder="Enter your full name">
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="{{ traveler.email or '' }}" placeholder="Enter your email" readonly>
                  </div>
                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" value="{{ traveler.phone or '' }}" placeholder="Enter your phone number">
                  </div>
                  <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-control" id="gender">
                      <option value="">Select Gender</option>
                      <option value="Male" {% if traveler.gender == "Male" %}selected{% endif %}>Male</option>
                      <option value="Female" {% if traveler.gender == "Female" %}selected{% endif %}>Female</option>
                      <option value="Other" {% if traveler.gender == "Other" %}selected{% endif %}>Other</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="date_of_birth" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="date_of_birth" value="{{ traveler.date_of_birth or '' }}">
                  </div>
                  <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" value="{{ traveler.address or '' }}" placeholder="Enter your address">
                  </div>
                  <div class="mb-3">
                    <label for="nationality" class="form-label">Nationality</label>
                    <input type="text" class="form-control" id="nationality" value="{{ traveler.nationality or '' }}" placeholder="Enter your nationality">
                  </div>
                  <div class="mb-3">
                    <label for="profile_picture" class="form-label">Profile Picture</label>
                    <input type="file" class="form-control" id="profile_picture" accept="image/*">
                    {% if traveler.profile_picture %}
                      <small class="text-muted">Current Profile Picture: <a href="{{ traveler.profile_picture }}" target="_blank">View</a></small>
                    {% endif %}
                  </div>
                  <div class="mb-3">
                    <label for="emergency_contact" class="form-label">Emergency Contact</label>
                    <input type="tel" class="form-control" id="emergency_contact" value="{{ traveler.emergency_contact or '' }}" placeholder="Enter emergency contact number">
                  </div>
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 text-center">
      <p class="mb-0 text-secondary fs--1 fw-medium">All rights reserved@travomate.co</p>
    </footer>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="vendors/@popperjs/popper.min.js"></script>
  <script src="vendors/bootstrap/bootstrap.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="/assets/frappe/js/frappe-web.min.js"></script>
  <script>
    // Ensure frappe object is available
    if (typeof frappe === 'undefined') {
      console.error('Frappe is not defined. Please ensure frappe-web.min.js is loaded correctly.');
    }
  
    // Get CSRF token from meta tag
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  
    // Handle form submission
    document.getElementById('travelerProfileForm').addEventListener('submit', function (event) {
      event.preventDefault();
  
      // Show loading spinner
      document.getElementById('loadingSpinner').style.display = 'block';
  
      // Get form values
      const fullName = document.getElementById('full_name').value;
      const phone = document.getElementById('phone').value;
      const gender = document.getElementById('gender').value;
      const dateOfBirth = document.getElementById('date_of_birth').value;
      const address = document.getElementById('address').value;
      const nationality = document.getElementById('nationality').value;
      const emergencyContact = document.getElementById('emergency_contact').value;
  
      // Validate required fields
      const requiredFields = ['full_name', 'phone', 'gender', 'date_of_birth', 'address', 'nationality', 'emergency_contact'];
      let isValid = true;
      requiredFields.forEach(field => {
        const fieldValue = document.getElementById(field).value;
        if (!fieldValue) {
          isValid = false;
          alert(`Please fill out the ${field.replace('_', ' ')} field.`);
        }
      });
  
      if (!isValid) {
        document.getElementById('loadingSpinner').style.display = 'none';
        return;
      }
  
      // Create FormData object to handle file uploads
      const formData = new FormData();
      formData.append('full_name', fullName);
      formData.append('phone', phone);
      formData.append('gender', gender);
      formData.append('date_of_birth', dateOfBirth);
      formData.append('address', address);
      formData.append('nationality', nationality);
      formData.append('emergency_contact', emergencyContact);
  
      // Append profile picture file if selected
      const profilePicture = document.getElementById('profile_picture').files[0];
      if (profilePicture) {
        formData.append('profile_picture', profilePicture);
      }
  
      // Debugging: Log FormData
      for (let [key, value] of formData.entries()) {
        console.log(key, value);
      }
  
      // Save data to the Traveler doctype using PATCH
      fetch('/api/method/travomate.custom_app.update_traveler_profile', {
        method: 'PATCH', // Use PATCH for partial updates
        body: formData,
        headers: {
          'X-Frappe-CSRF-Token': csrfToken, // Use the CSRF token from the meta tag
        },
      })
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.json();
        })
        .then(data => {
          if (data.message.status === 'success') {
            alert('Profile saved successfully!');
            window.location.href = '/traveler_dash'; // Redirect to dashboard
          } else {
            alert('Error saving profile. Please try again.');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
        })
        .finally(() => {
          // Hide loading spinner
          document.getElementById('loadingSpinner').style.display = 'none';
        });
    });
  
    // Logout function
    function logout() {
      fetch('/api/method/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Frappe-CSRF-Token': csrfToken, // Use the CSRF token from the meta tag
        },
      })
        .then(response => {
          if (response.ok) {
            window.location.href = 'index.html';
          } else {
            alert('Logout failed. Please try again.');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
        });
    }
  </script>
</body>
</html>
